# Adapted from the official Langfuse v4.78.0 Compose deployment.
x-langfuse-dependencies: &langfuse-dependencies
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy

x-langfuse-environment: &langfuse-environment
  HOSTNAME: 0.0.0.0
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:?Defina LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?Defina LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Defina LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Defina LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Defina LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Defina LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Defina LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  backend:
    environment:
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.78.0
    depends_on: *langfuse-dependencies
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Defina LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LANGFUSE_MINIO_PORT:-9090}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: AI Query Playground
      LANGFUSE_INIT_PROJECT_ID: ${VITE_LANGFUSE_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: AI Query Playground
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: AI Query Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true"]
      interval: 5s
      timeout: 5s
      retries: 36

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.78.0
    depends_on: *langfuse-dependencies
    environment: *langfuse-environment
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3030/api/health"]
      interval: 5s
      timeout: 5s
      retries: 36

  langfuse-postgres:
    image: docker.io/postgres:17
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Defina LANGFUSE_POSTGRES_PASSWORD}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "langfuse", "-d", "langfuse"]
      interval: 3s
      timeout: 3s
      retries: 15

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Defina LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  langfuse-redis:
    image: docker.io/redis:7
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?Defina LANGFUSE_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Defina LANGFUSE_REDIS_PASSWORD}
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 3s
      timeout: 3s
      retries: 15

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/langfuse && exec minio server --address :9000 --console-address :9001 /data"]
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?Defina LANGFUSE_MINIO_PASSWORD}
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
